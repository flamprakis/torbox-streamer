<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TorBox Streamer Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <div class="player-header">
    <span id="title" class="title">Loading stream...</span>
    <div class="header-actions">
      <div class="sub-controls" style="display:inline-flex;align-items:center;gap:6px;margin-right:8px;">
        <label for="sub-select" style="font-size:12px;color:#a0a0b0;">💬 Subs:</label>
        <select id="sub-select" class="btn" style="padding:4px 8px;font-size:12px;background:#242436;">
          <option value="">Off</option>
        </select>
        <button id="btn-sub-minus" class="btn" title="Subtitle Delay -0.5s" style="padding:4px 8px;font-size:12px;">-0.5s</button>
        <button id="btn-sub-plus" class="btn" title="Subtitle Delay +0.5s" style="padding:4px 8px;font-size:12px;">+0.5s</button>
        <button id="btn-reload-subs" class="btn" title="Reload Subtitles" style="padding:4px 8px;font-size:12px;">🔄</button>
      </div>
      <button id="btn-mpv" class="btn">Try in MPV</button>
      <button id="btn-vlc" class="btn">Try in VLC</button>
      <button id="btn-copy" class="btn">Copy Stream URL</button>
      <button id="btn-delete" class="btn btn-danger">Delete Torrent</button>
    </div>
  </div>

  <div class="video-container">
    <video id="video-player" controls autoplay preload="metadata">
      Your browser does not support HTML5 video playback.
    </video>
  </div>

  <script src="../torbox_api.js"></script>
  <script src="../subtitles_api.js"></script>
  <script src="player.js"></script>
</body>
</html>

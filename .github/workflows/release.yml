name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  validate-tag:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require the tag to match both package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = json.loads(Path('extension/manifest.json').read_text())['version']
          package_version = json.loads(Path('package.json').read_text())['version']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag) or tag != f'v{version}' or version != package_version:
              raise SystemExit('Release tag must be v<version> and match manifest.json and package.json')
          PY

  ci:
    name: Run every release quality check
    needs: validate-tag
    uses: ./.github/workflows/test.yml

  build-binaries:
    name: Build and test native host (${{ matrix.os }})
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: torbox-host.exe
          - os: ubuntu-24.04
            binary: torbox-host-linux
          - os: macos-latest
            binary: torbox-host-macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-build.txt
      - run: python -m pip install -r .github/requirements-build.txt
      - name: Build standalone host
        env:
          BINARY_NAME: ${{ matrix.binary }}
        shell: bash
        run: python -m PyInstaller --noconfirm --clean --onefile --name "$BINARY_NAME" helpers/native_host.py
      - name: Run the IPC contract against the compiled binary
        env:
          TORBOX_NATIVE_HOST_BINARY: ${{ github.workspace }}/dist/${{ matrix.binary }}
        run: python -m unittest discover -v -s tests/e2e -p "test_native_host_e2e.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.binary }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tested release artifacts
    needs: [ci, build-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the exact browser packages tested by CI
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: extension-packages
          path: release/
      - name: Download the tested standalone native hosts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: native-*
          merge-multiple: true
          path: release/
      - name: Verify release completeness and produce checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path('release')
          tag = os.environ['RELEASE_TAG']
          expected = {
              f'torbox-streamer-firefox-{tag}.zip', f'torbox-streamer-chrome-{tag}.zip',
              f'torbox-native-host-installer-{tag}.zip',
              'torbox-host.exe', 'torbox-host-linux', 'torbox-host-macos',
          }
          if {p.name for p in root.iterdir()} != expected:
              raise SystemExit('Missing or unexpected release artifacts')
          lines = [f'{hashlib.sha256((root / name).read_bytes()).hexdigest()}  {name}\n' for name in sorted(expected)]
          (root / 'SHA256SUMS').write_text(''.join(lines))
          PY
      - name: Create a release only for the existing validated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "TorBox Streamer $RELEASE_TAG" --generate-notes

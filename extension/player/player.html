<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TorBox Streamer Player</title>
  <link rel="stylesheet" href="player.css">
</head>
<body class="player-body">
  <div id="player-container" class="player-container">
    <!-- HTML5 Video Canvas -->
    <video id="video-player" preload="metadata" autoplay crossorigin="anonymous">
      Your browser does not support HTML5 video playback.
    </video>

    <!-- Top Overlay (Vignette Header) -->
    <div id="top-overlay" class="player-top-overlay">
      <div class="top-left">
        <span id="title" class="title">Loading stream...</span>
      </div>
    </div>

    <!-- Center Play Flash Animation -->
    <div id="center-play-flash" class="center-play-flash hidden">
      <div class="flash-circle">
        <svg id="flash-svg-play" class="svg-icon-large" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        <svg id="flash-svg-pause" class="svg-icon-large hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </div>
    </div>

    <!-- Bottom Overlay (Vignette + Translucent Controls Card) -->
    <div id="bottom-overlay" class="player-bottom-overlay">
      <div class="glass-controls-card">
        
        <!-- Interactive Seekbar Section -->
        <div class="seekbar-wrapper" id="seekbar-wrapper">
          <div class="seekbar-track">
            <div id="buffer-bar" class="buffer-bar"></div>
            <div id="progress-bar" class="progress-bar">
              <div class="progress-thumb"></div>
            </div>
          </div>
          <div id="time-tooltip" class="time-tooltip hidden">00:00</div>
        </div>

        <!-- Controls Row (Positioned Under Seekbar) -->
        <div class="controls-row">
          
          <!-- Left Group (Play/Pause, Volume, Time) -->
          <div class="controls-group left-controls">
            <button id="btn-play-pause" class="glass-icon-btn" title="Play / Pause (Space)">
              <svg id="icon-play" class="svg-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
              <svg id="icon-pause" class="svg-icon hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <div class="volume-group">
              <button id="btn-volume" class="glass-icon-btn" title="Mute / Unmute (M)">
                <svg id="icon-vol-high" class="svg-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                <svg id="icon-vol-mute" class="svg-icon hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>

            <div class="time-display">
              <span id="time-current">0:00</span>
              <span class="time-sep">/</span>
              <span id="time-duration">0:00</span>
            </div>
          </div>

          <!-- Right Group (Subtitles, External Players, Fullscreen) -->
          <div class="controls-group right-controls">
            
            <!-- Subtitles Pod -->
            <div class="glass-pod sub-controls">
              <label for="sub-select" class="sub-label">💬</label>
              <select id="sub-select" class="glass-select">
                <option value="">Off</option>
              </select>
              <button id="btn-sub-minus" class="glass-pill-btn" title="Subtitle Delay -0.5s">-0.5s</button>
              <button id="btn-sub-plus" class="glass-pill-btn" title="Subtitle Delay +0.5s">+0.5s</button>
              <button id="btn-reload-subs" class="glass-pill-btn" title="Reload Subtitles">🔄</button>
            </div>

            <!-- Desktop Players Pod -->
            <div class="glass-pod player-actions">
              <button id="btn-mpv" class="glass-pill-btn" title="Try in MPV">🚀 MPV</button>
              <button id="btn-vlc" class="glass-pill-btn" title="Try in VLC">🍊 VLC</button>
              <button id="btn-copy" class="glass-pill-btn" title="Copy Stream URL">📋 Copy</button>
              <button id="btn-delete" class="glass-pill-btn glass-btn-danger" title="Delete Torrent">🗑️</button>
            </div>

            <!-- Fullscreen Button -->
            <button id="btn-fullscreen" class="glass-icon-btn" title="Toggle Fullscreen (F)">
              <svg id="icon-fs-enter" class="svg-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              <svg id="icon-fs-exit" class="svg-icon hidden" viewBox="0 0 24 24"><path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
            </button>

          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="../torbox_api.js"></script>
  <script src="../subtitles_api.js"></script>
  <script src="player.js"></script>
</body>
</html>
